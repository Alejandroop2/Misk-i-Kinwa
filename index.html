<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misk'i Kinwa</title>
  <!-- Google Fonts & Lucide Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-layout">
    <!-- RULETA -->
    <div class="wheel-card">
      <h1 class="editable-title" contenteditable="true" id="wheelTitle" title="Haz clic para editar el título">💜 Misk'i Kinwa</h1>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
      </div>

      <button class="btn-spin" id="spinBtn">Girar Ruleta</button>
      <div class="result-box" id="result"></div>
    </div>

    <!-- PANEL DE CONTROL Y CONFIGURACIÓN -->
    <div class="control-panel">
      <div class="panel-title">
        <i data-lucide="settings"></i> Personalizar Opciones
      </div>

      <form class="add-form" id="addForm">
        <input type="text" class="input-text" id="newOptionText" placeholder="Nueva opción..." required />
        <input type="color" class="input-color" id="newOptionColor" value="#3b82f6" />
        <button type="submit" class="btn-add">
          <i data-lucide="plus"></i> Añadir
        </button>
      </form>

      <div class="options-list" id="optionsList"></div>

      <!-- HISTORIAL -->
      <div class="history-section">
        <div class="panel-title" style="font-size: 1rem; margin-bottom: 8px;">
          <i data-lucide="trophy"></i> Historial de Ganadores
        </div>
        <div class="history-list" id="historyList">
          <span style="font-size:0.85rem; color:#64748b;">Aún no hay ganadores</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
